planner:
  providers: [ollama, openrouter, google]
  model: gemma3:12b
  openrouter_model: google/gemma-3-12b-it
  google_model: gemma-4-26b-a4b-it
  role: itinerary_generation_and_reflection

task_slm:
  providers: [ollama, openrouter, google]
  model: gemma3:4b
  openrouter_model: google/gemma-3-4b-it
  google_model: gemma-4-26b-a4b-it
  role: extraction_classification_summarization

chat_fallback:
  provider: ollama
  model: qwen2.5-coder:3b
  role: temporary_fallback_when_configured_gemma_models_are_unavailable

embedding:
  providers: [ollama, openrouter, google]
  model: bge-m3
  openrouter_model: baai/bge-m3
  google_model: gemini-embedding-001

embedding_fallback:
  provider: ollama
  model: all-minilm
  role: lightweight_fallback_when_bge_m3_is_unavailable

reranker:
  provider: sentence_transformers
  model: BAAI/bge-reranker-v2-m3
