[project]
name = "travelmind-backend"
version = "0.1.0"
description = "TravelMind AI API and agent orchestration"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "httpx",
  "langgraph",
  "qdrant-client",
  "opensearch-py",
  "neo4j",
  "sqlalchemy",
  "alembic",
  "psycopg[binary]",
  "redis",
  "ortools",
  "python-multipart",
  "ollama",
]

[project.optional-dependencies]
ingestion = ["beautifulsoup4", "trafilatura", "pymupdf"]
local = ["sentence-transformers"]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "../tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
